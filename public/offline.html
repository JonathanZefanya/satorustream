<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sedang Offline — SatoruStream</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --panel: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --brand: #f97316;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --panel: #0f172a;
          --ink: #f1f5f9;
          --muted: #94a3b8;
          --border: #1e293b;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        text-align: center;
        box-shadow: 0 20px 45px -30px rgba(15, 23, 42, 0.45);
      }

      img {
        width: 56px;
        height: 56px;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
      }

      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
      }

      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="SatoruStream" />
      <h1>Kamu sedang offline</h1>
      <p>
        Halaman ini belum tersimpan di perangkat. Sambungkan kembali internet, lalu coba muat ulang.
        Halaman yang pernah dibuka tetap bisa diakses saat offline.
      </p>
      <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
